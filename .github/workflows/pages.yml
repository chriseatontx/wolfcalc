name: Deploy calculator demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload calculator site
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            index.html
            styles.css
            js/
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
