name: Enforce calculator version

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version contract
        env:
          BASE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.sha }}
        run: node scripts/check-version.js "$BASE_REVISION" "$HEAD_REVISION"
